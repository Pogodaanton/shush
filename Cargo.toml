[package]
name = "shush"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Pogodaanton/shush"
license = "MIT"

[dependencies]
chrono = "0.4.42"
directories = "6.0.0"
env_logger = "0.11.8"
iced = { version = "0.13.1", features = ["tokio"], optional = true }
librespot = "0.7.1"
log = "0.4.28"
rspotify = "0.15.1"
serde = "1.0.228"
tokio = { version = "1.47.1" , features = ["fs", "time"]}
tokio-stream = "0.1.17"
toml = { version = "0.9.7" , features = ["parse", "serde"]}

[features]
iced = ["dep:iced"]